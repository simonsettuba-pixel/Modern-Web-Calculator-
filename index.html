<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator interface">
    <div class="display" aria-label="Calculator display">0</div>

    <section class="keypad" aria-label="Calculator keypad">
      <button class="key clear" type="button">AC</button>
      <button class="key" type="button">00</button>
      <button class="key" type="button">%</button>
      <button class="key operator" type="button">÷</button>

      <button class="key" type="button">7</button>
      <button class="key" type="button">8</button>
      <button class="key" type="button">9</button>
      <button class="key operator" type="button">×</button>

      <button class="key" type="button">4</button>
      <button class="key" type="button">5</button>
      <button class="key" type="button">6</button>
      <button class="key operator" type="button">−</button>

      <button class="key" type="button">1</button>
      <button class="key" type="button">2</button>
      <button class="key" type="button">3</button>
      <button class="key operator" type="button">+</button>

      <button class="key zero" type="button">0</button>
      <span class="key-spacer" aria-hidden="true"></span>
      <button class="key decimal" type="button">.</button>
      <button class="key operator" type="button">=</button>
    </section>
  </main>
</body>
</html>
